name: Site quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate paths, MathML, HTML and SVG
        run: python scripts/check_site.py
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check 1440/390/360 layout, formulas, images and alpha interaction
        run: python scripts/browser_qa.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: reports/browser/
          if-no-files-found: ignore

  reproducible-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical example dependencies
        run: python -m pip install -r requirements-examples.txt
      - name: Execute chapter examples
        run: python scripts/check_examples.py
