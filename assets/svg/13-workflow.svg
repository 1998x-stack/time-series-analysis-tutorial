<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="wf-title wf-desc"><title id="wf-title">Box–Jenkins 建模流程是一个可迭代循环</title><desc id="wf-desc">探索与变换、识别阶数、估计参数、残差诊断、前向验证构成一条流程；当残差诊断未通过时，回到识别阶段重新选择阶数，而不是直接进入预测。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.box{font-size:14px;font-weight:700}.note{font-size:13px;fill:#586e72}</style><defs><marker id="wf-ar" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#147f80"/></marker><marker id="wf-arb" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#d06d4d"/></marker></defs><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">Box–Jenkins 流程：诊断未过就回到识别，而不是硬着头皮预测</text><rect x="24" y="60" width="912" height="280" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><g class="box" text-anchor="middle"><rect x="52" y="120" width="150" height="66" rx="10" fill="#e8f4f0" stroke="#147f80"/><text x="127" y="150">探索与变换</text><text x="127" y="170" class="note">缺失 / 趋势 / 季节</text><rect x="232" y="120" width="150" height="66" rx="10" fill="#e8f4f0" stroke="#147f80"/><text x="307" y="150">识别阶数</text><text x="307" y="170" class="note">ACF / PACF 线索</text><rect x="412" y="120" width="150" height="66" rx="10" fill="#e8f4f0" stroke="#147f80"/><text x="487" y="150">估计参数</text><text x="487" y="170" class="note">ML / 候选比较</text><rect x="592" y="120" width="150" height="66" rx="10" fill="#fbf4ef" stroke="#d06d4d"/><text x="667" y="150">残差诊断</text><text x="667" y="170" class="note">ACF / LB / QQ</text><rect x="772" y="120" width="140" height="66" rx="10" fill="#eef0fa" stroke="#7461ba"/><text x="842" y="150">前向验证</text><text x="842" y="170" class="note">留出集预测</text></g><g stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#wf-ar)"><path d="M202 153 L230 153"/><path d="M382 153 L410 153"/><path d="M562 153 L590 153"/></g><path d="M742 153 L770 153" stroke="#7461ba" stroke-width="2.4" fill="none" marker-end="url(#wf-ar)"/><path d="M667 186 C600 268 380 268 307 186" stroke="#d06d4d" stroke-width="2.4" fill="none" stroke-dasharray="7 6" marker-end="url(#wf-arb)"/><text x="487" y="252" class="note" text-anchor="middle" fill="#a4502f">残差未通过：回到识别，重新选阶或补季节项</text><text x="32" y="358" class="note">流程可重复多轮；每一步的判断依据都应只使用训练集信息，避免时间泄露。</text></svg>
