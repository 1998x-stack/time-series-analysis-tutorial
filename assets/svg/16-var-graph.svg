<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="vg-title vg-desc"><title id="vg-title">VAR 中每个变量都受所有变量滞后的影响</title><desc id="vg-desc">两个变量的 VAR 里，y1 的当期值取决于 y1 与 y2 的滞后，y2 亦然；双向箭头表示滞后交叉反馈，构成一个联立系统。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.box{font-size:15px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><defs><marker id="vg-ar" markerWidth="12" markerHeight="12" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#147f80"/></marker></defs><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">VAR：两变量系统里滞后项双向交叉</text><rect x="24" y="60" width="912" height="280" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><rect x="180" y="120" width="200" height="80" rx="12" fill="#e8f4f0" stroke="#147f80"/><text x="280" y="155" class="box" text-anchor="middle">y₁,t</text><text x="280" y="180" class="note" text-anchor="middle">受 y₁ 与 y₂ 的滞后影响</text><rect x="580" y="120" width="200" height="80" rx="12" fill="#e8f4f0" stroke="#147f80"/><text x="680" y="155" class="box" text-anchor="middle">y₂,t</text><text x="680" y="180" class="note" text-anchor="middle">也受 y₁ 与 y₂ 的滞后影响</text><path d="M380 140 C470 100 490 100 580 140" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#vg-ar)"/><path d="M580 180 C490 220 470 220 380 180" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#vg-ar)"/><text x="480" y="96" class="note" text-anchor="middle">a₁₂：y₂ 滞后 → y₁</text><text x="480" y="240" class="note" text-anchor="middle">a₂₁：y₁ 滞后 → y₂</text><path d="M150 140 C120 150 120 180 180 180" stroke="#7461ba" stroke-width="2.4" fill="none" marker-end="url(#vg-ar)"/><text x="96" y="166" class="note" text-anchor="middle">自身滞后</text><path d="M790 140 C820 150 820 180 780 180" stroke="#7461ba" stroke-width="2.4" fill="none" marker-end="url(#vg-ar)"/><text x="866" y="166" class="note" text-anchor="middle">自身滞后</text><text x="32" y="324" class="note">结构示意：当期值由常数项 + 各变量滞后项的线性组合 + 当期创新组成；双向箭头不代表“真实因果”，只是条件相关的建模形式。</text></svg>
