<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="gm-title gm-desc"><title id="gm-title">GARCH 条件方差对冲击的响应长度取决于 α+β</title><desc id="gm-desc">对平方冲击的响应按 (α+β) 的幂衰减：α+β 越接近 1，波动率冲击越持久；α+β 明显小于 1 时冲击很快消退。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.strong{font-size:15px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">波动率冲击的持久性由 α+β 决定</text><rect x="24" y="60" width="912" height="290" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><path d="M110 300 L860 300" stroke="#b7c9c8" stroke-width="2" fill="none"/><path d="M110 300 L110 84" stroke="#b7c9c8" stroke-width="2" fill="none"/><text x="102" y="96" class="note" text-anchor="end">响应</text><text x="485" y="334" class="note" text-anchor="middle">冲击后第 j 期</text><polyline points="110.0,96.0 142.6,106.2 175.2,115.9 207.8,125.1 240.4,133.8 273.0,142.1 305.7,150.0 338.3,157.5 370.9,164.7 403.5,171.4 436.1,177.9 468.7,184.0 501.3,189.8 533.9,195.3 566.5,200.5 599.1,205.5 631.7,210.2 664.3,214.7 697.0,219.0 729.6,223.0 762.2,226.9 794.8,230.5 827.4,234.0 860.0,237.3" fill="none" stroke="#d06d4d" stroke-width="3"/><polyline points="110.0,198.0 142.6,203.1 175.2,207.9 207.8,212.5 240.4,216.9 273.0,221.1 305.7,225.0 338.3,228.8 370.9,232.3 403.5,235.7 436.1,238.9 468.7,242.0 501.3,244.9 533.9,247.6 566.5,250.3 599.1,252.7 631.7,255.1 664.3,257.4 697.0,259.5 729.6,261.5 762.2,263.4 794.8,265.3 827.4,267.0 860.0,268.6" fill="none" stroke="#147f80" stroke-width="3"/><polyline points="110.0,96.0 142.6,157.2 175.2,200.0 207.8,230.0 240.4,251.0 273.0,265.7 305.7,276.0 338.3,283.2 370.9,288.2 403.5,291.8 436.1,294.2 468.7,296.0 501.3,297.2 533.9,298.0 566.5,298.6 599.1,299.0 631.7,299.3 664.3,299.5 697.0,299.7 729.6,299.8 762.2,299.8 794.8,299.9 827.4,299.9 860.0,299.9" fill="none" stroke="#7461ba" stroke-width="3"/><g><rect x="150" y="330" width="16" height="16" rx="3" fill="#d06d4d"/><text x="172" y="344" class="note">α=0.20, β=0.75 (α+β=0.95)</text></g><g><rect x="450" y="330" width="16" height="16" rx="3" fill="#147f80"/><text x="472" y="344" class="note">α=0.10, β=0.85 (α+β=0.95)</text></g><g><rect x="750" y="330" width="16" height="16" rx="3" fill="#7461ba"/><text x="772" y="344" class="note">α=0.20, β=0.50 (α+β=0.70)</text></g><text x="32" y="366" class="note">教学示意：按 α(α+β)^{j−1} 的解析响应绘制，非估计结果。</text></svg>