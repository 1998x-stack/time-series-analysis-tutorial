<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="cp-title cp-desc"><title id="cp-title">SARIMA 的冲击响应在滞后 13 出现交叉项</title><desc id="cp-desc">SARIMA(1,0,0)(1,0,0)12 写成算子乘积后可展开为无穷 MA，非零权重出现在 i+12j 处，因而滞后 13 同时受普通与季节反馈影响。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.strong{font-size:15px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">SARIMA(1,0,0)(1,0,0)₁₂ 的冲击响应：滞后 13 = 1 + 12</text><rect x="24" y="70" width="912" height="248" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><text x="42" y="96" class="strong">ψ_k：（1−φB)(1−ΦB¹²) 的倒数展开，φ=Φ=0.5</text><text x="42" y="118" class="note">橙色柱：滞后 12、24；交叉项让滞后 13 也非零</text><path d="M54 282 L914 282" stroke="#b7c9c8" stroke-width="2" fill="none"/><rect x="54.0" y="102.0" width="28.9" height="180.0" fill="#7461ba"/><rect x="85.9" y="192.0" width="28.9" height="90.0" fill="#7461ba"/><rect x="117.7" y="237.0" width="28.9" height="45.0" fill="#7461ba"/><rect x="149.6" y="259.5" width="28.9" height="22.5" fill="#7461ba"/><rect x="181.4" y="270.8" width="28.9" height="11.2" fill="#7461ba"/><rect x="213.3" y="276.4" width="28.9" height="5.6" fill="#7461ba"/><rect x="245.1" y="279.2" width="28.9" height="2.8" fill="#7461ba"/><rect x="277.0" y="280.0" width="28.9" height="2.0" fill="#7461ba"/><rect x="308.8" y="280.0" width="28.9" height="2.0" fill="#7461ba"/><rect x="340.7" y="280.0" width="28.9" height="2.0" fill="#7461ba"/><rect x="372.5" y="280.0" width="28.9" height="2.0" fill="#7461ba"/><rect x="404.4" y="280.0" width="28.9" height="2.0" fill="#7461ba"/><rect x="436.2" y="192.0" width="28.9" height="90.0" fill="#d06d4d"/><rect x="468.1" y="237.0" width="28.9" height="45.0" fill="#7461ba"/><rect x="499.9" y="259.5" width="28.9" height="22.5" fill="#7461ba"/><rect x="531.8" y="270.7" width="28.9" height="11.3" fill="#7461ba"/><rect x="563.6" y="276.4" width="28.9" height="5.6" fill="#7461ba"/><rect x="595.5" y="279.2" width="28.9" height="2.8" fill="#7461ba"/><rect x="627.3" y="280.0" width="28.9" height="2.0" fill="#7461ba"/><rect x="659.2" y="280.0" width="28.9" height="2.0" fill="#7461ba"/><rect x="691.0" y="280.0" width="28.9" height="2.0" fill="#7461ba"/><rect x="722.9" y="280.0" width="28.9" height="2.0" fill="#7461ba"/><rect x="754.7" y="280.0" width="28.9" height="2.0" fill="#7461ba"/><rect x="786.6" y="280.0" width="28.9" height="2.0" fill="#7461ba"/><rect x="818.4" y="237.0" width="28.9" height="45.0" fill="#d06d4d"/><rect x="850.3" y="259.5" width="28.9" height="22.5" fill="#7461ba"/><rect x="882.1" y="270.7" width="28.9" height="11.3" fill="#7461ba"/><text x="54.0" y="300" class="note" text-anchor="middle">0</text><text x="245.1" y="300" class="note" text-anchor="middle">6</text><text x="436.2" y="300" class="note" text-anchor="middle">12</text><text x="627.3" y="300" class="note" text-anchor="middle">18</text><text x="818.4" y="300" class="note" text-anchor="middle">24</text><text x="85.9" y="184.0" class="note" text-anchor="middle">0.50</text><text x="436.2" y="184.0" class="note" text-anchor="middle">0.50</text><text x="468.1" y="229.0" class="note" text-anchor="middle">0.25</text><text x="32" y="352" class="note">教学示意：按 φ=Φ=0.5 的解析系数绘制的理论冲击响应，非估计结果。</text></svg>