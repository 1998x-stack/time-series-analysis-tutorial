<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="maoverlap-title maoverlap-desc"><title id="maoverlap-title">MA(1) 自相关只在第一阶存在</title><desc id="maoverlap-desc">MA(1) 的 yₜ 与 yₜ₋₁ 共享创新 εₜ₋₁，但 yₜ 与 yₜ₋₂ 没有共享创新，因此第二阶理论协方差为零。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.label{font-size:15px}.strong{font-size:16px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="34" y="40" class="heading">共享同一个随机创新，才能形成线性协方差</text><rect x="29" y="69" width="901" height="274" rx="13" fill="#f4f8f5" stroke="#dce7e4"/><text x="58" y="119" class="strong">yₜ = εₜ + θ εₜ₋₁</text><text x="58" y="172" class="strong">yₜ₋₁ = εₜ₋₁ + θ εₜ₋₂</text><text x="58" y="225" class="strong">yₜ₋₂ = εₜ₋₂ + θ εₜ₋₃</text><rect x="510" y="130" width="381" height="58" rx="13" fill="#dff2ed" stroke="#dce7e4"/><text x="532" y="168" class="strong">滞后 1：共享 εₜ₋₁</text><text x="526" y="258" class="label">滞后 2：无共享创新 → γ₂=0</text><text x="60" y="315" class="note">前提：创新均值为零、彼此不相关且方差恒定。</text></svg>