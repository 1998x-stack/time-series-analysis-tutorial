<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" role="img" aria-labelledby="seasonality-title seasonality-desc"><title id="seasonality-title">季节波动的加法与乘法</title><desc id="seasonality-desc">左：固定振幅的加法季节；右：随水平变化放大幅度的乘法季节。仅为概念模拟。</desc><rect x="1" y="1" width="958" height="350" rx="20" fill="#fffdf9" stroke="#dce5e5"/><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#294049} .k{font-size:14px;font-weight:650}.s{font-size:12px;fill:#647880}.t{font-size:18px;font-weight:750}.grid{stroke:#e4ebec;stroke-width:1} .a{stroke:#147f80;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{stroke:#d06d4d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{stroke:#7461ba;stroke-width:2.5;fill:none;stroke-linecap:round} .panel{fill:#f7f9f7;stroke:#dfe9e8}</style><rect class="panel" x="31" y="35" width="439" height="284" rx="14"/><rect class="panel" x="490" y="35" width="439" height="284" rx="14"/><text class="t" x="56" y="67">加法：振幅恒定</text><text class="t" x="513" y="67">乘法：振幅随水平增长</text><line x1="58" y1="268" x2="442" y2="268" stroke="#8fa5a5" stroke-width="1.5"/><line class="grid" x1="58" y1="97" x2="442" y2="97"/><line class="grid" x1="58" y1="154" x2="442" y2="154"/><line class="grid" x1="58" y1="211" x2="442" y2="211"/><line class="grid" x1="58" y1="268" x2="442" y2="268"/><line x1="518" y1="268" x2="902" y2="268" stroke="#8fa5a5" stroke-width="1.5"/><line class="grid" x1="518" y1="97" x2="902" y2="97"/><line class="grid" x1="518" y1="154" x2="902" y2="154"/><line class="grid" x1="518" y1="211" x2="902" y2="211"/><line class="grid" x1="518" y1="268" x2="902" y2="268"/><path class="a"  d="M58 236.9 L72.2 220.6 L86.4 217.8 L100.7 228.5 L114.9 239.2 L129.1 236.4 L143.3 220.1 L157.6 203.9 L171.8 201.1 L186 211.7 L200.2 222.4 L214.4 219.6 L228.7 203.3 L242.9 187.1 L257.1 184.3 L271.3 194.9 L285.6 205.6 L299.8 202.8 L314 186.5 L328.2 170.3 L342.4 167.5 L356.7 178.1 L370.9 188.8 L385.1 186 L399.3 169.8