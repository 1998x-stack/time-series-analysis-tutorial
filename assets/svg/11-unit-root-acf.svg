<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="ur-title ur-desc"><title id="ur-title">随机游走水平与其一阶差分的自相关对比</title><desc id="ur-desc">合成随机游走的水平序列自相关在各滞后仍接近 1；一阶差分后除零滞后外自相关接近 0，说明差分去除了单位根。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.strong{font-size:15px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">差分把“缓慢衰减的自相关”变成“近似白噪声”</text><rect x="24" y="70" width="440" height="248" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><text x="40" y="96" class="strong">随机游走的水平 y_t</text><text x="40" y="118" class="note">样本自相关在各滞后都接近 1（衰减极慢）</text><path d="M54 282 L434 282" stroke="#b7c9c8" stroke-width="2" fill="none"/><path d="M54 62 L54 322" stroke="#b7c9c8" stroke-width="2" fill="none"/><text x="32" y="60" class="note">ρ</text><rect x="496" y="70" width="440" height="248" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><text x="512" y="96" class="strong">一阶差分 Δy_t</text><text x="512" y="118" class="note">除 ρ(0)=1 外各滞后接近 0</text><path d="M526 282 L906 282" stroke="#b7c9c8" stroke-width="2" fill="none"/><path d="M526 62 L526 322" stroke="#b7c9c8" stroke-width="2" fill="none"/><text x="504" y="60" class="note">ρ</text><rect x="54.0" y="82.0" width="30.0" height="200.0" rx="3" fill="#147f80"/><text x="69.0" y="312" class="note" text-anchor="middle">0</text><rect x="92.0" y="84.5" width="30.0" height="197.5" rx="3" fill="#147f80"/><text x="107.0" y="312" class="note" text-anchor="middle">1</text><rect x="130.0" y="87.1" width="30.0" height="194.9" rx="3" fill="#147f80"/><text x="145.0" y="312" class="note" text-anchor="middle">2</text><rect x="168.0" y="90.1" width="30.0" height="191.9" rx="3" fill="#147f80"/><text x="183.0" y="312" class="note" text-anchor="middle">3</text><rect x="206.0" y="92.8" width="30.0" height="189.2" rx="3" fill="#147f80"/><text x="221.0" y="312" class="note" text-anchor="middle">4</text><rect x="244.0" y="95.4" width="30.0" height="186.6" rx="3" fill="#147f80"/><text x="259.0" y="312" class="note" text-anchor="middle">5</text><rect x="282.0" y="97.8" width="30.0" height="184.2" rx="3" fill="#147f80"/><text x="297.0" y="312" class="note" text-anchor="middle">6</text><rect x="320.0" y="100.3" width="30.0" height="181.7" rx="3" fill="#147f80"/><text x="335.0" y="312" class="note" text-anchor="middle">7</text><rect x="358.0" y="102.9" width="30.0" height="179.1" rx="3" fill="#147f80"/><text x="373.0" y="312" class="note" text-anchor="middle">8</text><rect x="396.0" y="105.6" width="30.0" height="176.4" rx="3" fill="#147f80"/><text x="411.0" y="312" class="note" text-anchor="middle">9</text><rect x="526.0" y="82.0" width="30.0" height="200.0" rx="3" fill="#d06d4d"/><text x="541.0" y="312" class="note" text-anchor="middle">0</text><rect x="564.0" y="282.0" width="30.0" height="4.8" rx="3" fill="#d06d4d"/><text x="579.0" y="312" class="note" text-anchor="middle">1</text><rect x="602.0" y="262.2" width="30.0" height="19.8" rx="3" fill="#d06d4d"/><text x="617.0" y="312" class="note" text-anchor="middle">2</text><rect x="640.0" y="282.0" width="30.0" height="15.3" rx="3" fill="#d06d4d"/><text x="655.0" y="312" class="note" text-anchor="middle">3</text><rect x="678.0" y="282.0" width="30.0" height="4.1" rx="3" fill="#d06d4d"/><text x="693.0" y="312" class="note" text-anchor="middle">4</text><rect x="716.0" y="282.0" width="30.0" height="2.0" rx="3" fill="#d06d4d"/><text x="731.0" y="312" class="note" text-anchor="middle">5</text><rect x="754.0" y="282.0" width="30.0" height="2.0" rx="3" fill="#d06d4d"/><text x="769.0" y="312" class="note" text-anchor="middle">6</text><rect x="792.0" y="279.8" width="30.0" height="2.2" rx="3" fill="#d06d4d"/><text x="807.0" y="312" class="note" text-anchor="middle">7</text><rect x="830.0" y="282.0" width="30.0" height="8.2" rx="3" fill="#d06d4d"/><text x="845.0" y="312" class="note" text-anchor="middle">8</text><rect x="868.0" y="270.8" width="30.0" height="11.2" rx="3" fill="#d06d4d"/><text x="883.0" y="312" class="note" text-anchor="middle">9</text><text x="32" y="352" class="note">教学示意：固定种子的合成随机游走（n=400）的样本自相关，非真实数据。</text></svg>