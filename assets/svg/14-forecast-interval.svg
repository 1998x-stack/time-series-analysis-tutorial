<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="iv-title iv-desc"><title id="iv-title">预测区间：平稳收敛与积分发散</title><desc id="iv-desc">平稳 ARMA 的预测区间宽度随步长收敛到一个固定值；含一阶差分的 ARIMA 预测区间按根号步长持续变宽，不会收敛。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.strong{font-size:15px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">预测区间如何随步长变化，取决于是否含单位根</text><rect x="24" y="70" width="440" height="248" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><text x="40" y="96" class="strong">平稳 ARMA(1,0,0)，φ=0.7</text><text x="40" y="118" class="note">区间宽度收敛到固定值</text><polygon points="78.0,250.0 102.7,208.0 127.4,198.7 152.1,194.8 176.9,192.9 201.6,192.0 226.3,191.6 251.0,191.4 275.7,191.3 300.4,191.2 325.1,191.2 349.9,191.2 374.6,191.2 399.3,191.2 424.0,191.2 448.7,308.8 424.0,308.8 399.3,308.8 374.6,308.8 349.9,308.8 325.1,308.8 300.4,308.8 275.7,308.7 251.0,308.6 226.3,308.4 201.6,308.0 176.9,307.1 152.1,305.2 127.4,301.3 102.7,292.0 78.0,250.0" fill="#147f80" opacity="0.20"/><polyline points="78.0,250.0 102.7,250.0 127.4,250.0 152.1,250.0 176.9,250.0 201.6,250.0 226.3,250.0 251.0,250.0 275.7,250.0 300.4,250.0 325.1,250.0 349.9,250.0 374.6,250.0 399.3,250.0 424.0,250.0" fill="none" stroke="#147f80" stroke-width="2.5"/><path d="M78 320 L78 180" stroke="#b7c9c8" stroke-width="2" fill="none"/><path d="M78 250 L424 250" stroke="#b7c9c8" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/><text x="70" y="255" class="note" text-anchor="end">μ</text><text x="78" y="338" class="note">h=1</text><text x="424" y="338" class="note" text-anchor="end">h=14</text><rect x="496" y="70" width="440" height="248" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><text x="512" y="96" class="strong">ARIMA(0,1,0)（随机游走）</text><text x="512" y="118" class="note">区间宽度按 √h 持续变宽</text><polygon points="550.0,250.0 574.7,220.6 599.4,208.4 624.1,199.1 648.9,191.2 673.6,184.3 698.3,178.0 723.0,172.2 747.7,166.8 772.4,161.8 797.1,157.0 821.9,152.5 846.6,148.2 871.3,144.0 896.0,140.0 920.7,363.9 896.0,360.0 871.3,356.0 846.6,351.8 821.9,347.5 797.1,343.0 772.4,338.2 747.7,333.2 723.0,327.8 698.3,322.0 673.6,315.7 648.9,308.8 624.1,300.9 599.4,291.6 574.7,279.4 550.0,250.0" fill="#d06d4d" opacity="0.20"/><polyline points="550.0,250.0 574.7,250.0 599.4,250.0 624.1,250.0 648.9,250.0 673.6,250.0 698.3,250.0 723.0,250.0 747.7,250.0 772.4,250.0 797.1,250.0 821.9,250.0 846.6,250.0 871.3,250.0 896.0,250.0" fill="none" stroke="#d06d4d" stroke-width="2.5"/><path d="M550 320 L550 180" stroke="#b7c9c8" stroke-width="2" fill="none"/><path d="M550 250 L896 250" stroke="#b7c9c8" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/><text x="542" y="255" class="note" text-anchor="end">μ</text><text x="550" y="338" class="note">h=1</text><text x="896" y="338" class="note" text-anchor="end">h=14</text><text x="32" y="352" class="note">教学示意：两panel 用同一纵轴尺度，按平稳 ARMA 与随机游走的解析误差方差绘制。</text></svg>