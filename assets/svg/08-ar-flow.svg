<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="arflow-title arflow-desc"><title id="arflow-title">AR(3) 的滞后观测参与下一期预测</title><desc id="arflow-desc">AR(3) 使用三期历史观测线性组合来计算条件预测，新创新在预测时尚不可观察。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.label{font-size:15px}.strong{font-size:16px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="35" y="40" class="heading">当前预测来自过去，当前创新在预测时不可得</text><rect x="35" y="116" width="202" height="115" rx="13" fill="#e4f2ed" stroke="#dce7e4"/><text x="58" y="160" class="strong">yₜ₋₃</text><text x="58" y="198" class="label">φ₃</text><rect x="264" y="116" width="202" height="115" rx="13" fill="#e4f2ed" stroke="#dce7e4"/><text x="287" y="160" class="strong">yₜ₋₂</text><text x="287" y="198" class="label">φ₂</text><rect x="493" y="116" width="202" height="115" rx="13" fill="#e4f2ed" stroke="#dce7e4"/><text x="516" y="160" class="strong">yₜ₋₁</text><text x="516" y="198" class="label">φ₁</text><rect x="722" y="116" width="202" height="115" rx="13" fill="#ede9f7" stroke="#dce7e4"/><text x="745" y="160" class="strong">ŷₜ|ₜ₋₁</text><text x="745" y="198" class="label">加权组合</text><path d="M240 178 L264 178" stroke="#147f80" stroke-width="4"  fill="none"/><path d="M468 178 L492 178" stroke="#147f80" stroke-width="4"  fill="none"/><path d="M697 178 L720 178" stroke="#147f80" stroke-width="4"  fill="none"/><text x="46" y="298" class="note">预测真实值时还需叠加新冲击 εₜ；不能在预测时偷用 εₜ。</text></svg>