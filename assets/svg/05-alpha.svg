<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346" role="img" aria-labelledby="alpha-title alpha-desc"><title id="alpha-title">相同观测下不同平滑系数的响应</title><desc id="alpha-desc">α=0.2 的平滑较慢；α=0.7 对最新观测更敏感。图中平滑从首个观测值初始化。</desc><rect x="1" y="1" width="958" height="344" rx="20" fill="#fffdf9" stroke="#dce5e5"/><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#294049} .k{font-size:14px;font-weight:650}.s{font-size:12px;fill:#647880}.t{font-size:18px;font-weight:750}.grid{stroke:#e4ebec;stroke-width:1} .a{stroke:#147f80;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{stroke:#d06d4d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{stroke:#7461ba;stroke-width:2.5;fill:none;stroke-linecap:round} .panel{fill:#f7f9f7;stroke:#dfe9e8}</style><rect class="panel" x="34" y="38" width="892" height="271" rx="14"/><text class="t" x="62" y="76">α 决定更新水平的速度，而不是模型能否预测趋势</text><line x1="70" y1="264" x2="894" y2="264" stroke="#8fa5a5" stroke-width="1.5"/><line class="grid" x1="70" y1="113" x2="894" y2="113"/><line class="grid" x1="70" y1="163.3" x2="894" y2="163.3"/><line class="grid" x1="70" y1="213.7" x2="894" y2="213.7"/><line class="grid" x1="70" y1="264" x2="894" y2="264"/><path class="c"  d="M70 191.3 L109.2 182.5 L148.5 185.9 L187.7 184.7 L227 183.3 L266.2 196.5 L305.4 215.9 L344.7 214.1 L383.9 185.1 L423.1 156.7 L462.4 154.3 L501.6 168.6 L540.9 176.5 L580.1 176.3 L619.3 182.3 L658.6 190.9 L697.8 181.2 L737 150.6 L776.3 127.6 L815.5 134.9 L854.8 158.7 L894 169.9"/><path class="a"  d="M70 191.3 L109.2 189.5 L148.5 188.8 L187.7 188 L227 187.1 L266.2 188.9 L305.4 194.3 L344.7 198.3 L383.9 195.6 L423.1 187.9 L462.4 181.1 L501.6 178.6 L540.9 178.2 L580.1 177.8 L619.3 178.7 L658.6 181.2 L697.8 181.2 L737 175.1 L776.3 165.6 L815.5 159.4 L854.8 159.3 L894 161.4"/><path class="b"  d="M70 191.3 L109.2 185.2 L148.5 185.7 L187.7 185 L227 183.8 L266.2 192.7 L305.4 208.9 L344.7 212.6 L383.9 193.3 L423.1 167.7 L462.4 158.3 L501.6 165.5 L540.9 173.2 L580.1 175.4 L619.3 180.2 L658.6 187.7 L697.8 183.2 L737 160.4 L776.3 137.4 L815.5 135.7 L854.8 151.8 L894 164.5"/><text class="s" x="67" y="291">观测：紫色</text><text class="s" x="237" y="291">α=0.2：青色</text><text class="s" x="417" y="291">α=0.7：橙色</text></svg>