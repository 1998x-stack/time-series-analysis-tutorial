<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" role="img" aria-labelledby="paths-title paths-desc"><title id="paths-title">直接关联与间接关联</title><desc id="paths-desc">ACF 测量总关联；PACF 在控制中间滞后变量后测量剩余的线性关联。</desc><rect x="1" y="1" width="958" height="346" rx="20" fill="#fffdf9" stroke="#dce5e5"/><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#294049} .k{font-size:14px;font-weight:650}.s{font-size:12px;fill:#647880}.t{font-size:18px;font-weight:750}.grid{stroke:#e4ebec;stroke-width:1} .a{stroke:#147f80;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{stroke:#d06d4d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{stroke:#7461ba;stroke-width:2.5;fill:none;stroke-linecap:round} .panel{fill:#f7f9f7;stroke:#dfe9e8}</style><rect class="panel" x="33" y="42" width="894" height="264" rx="15"/><text class="t" x="62" y="77">在 AR(1) 中，一阶影响能通过中间时点传播。</text><rect x="86" y="146" width="154" height="61" rx="12" fill="#d9eeeb" stroke="#9ab7b6"/><text class="k" x="125" y="182">t−2 时点</text><rect x="391" y="146" width="154" height="61" rx="12" fill="#eee9f7" stroke="#9ab7b6"/><text class="k" x="430" y="182">t−1 时点</text><rect x="696" y="146" width="154" height="61" rx="12" fill="#d9eeeb" stroke="#9ab7b6"/><text class="k" x="735" y="182">t 时点</text><path d="M245 176 H389 M550 176 H694" stroke="#147f80" stroke-width="3" fill="none"/><path d="M380 170 l10 6 -10 6 M686 170 l10 6 -10 6" stroke="#147f80" fill="none" stroke-width="2"/><path d="M163 132 C320 83 615 83 770 132" stroke="#d06d4d" stroke-dasharray="7 6" stroke-width="2.5" fill="none"/><text class="k" x="419" y="112">ACF 的间接关联</text><text class="s" x="321" y="261">PACF(k=2)：控制 t−1 后，AR(1) 的剩余关联为 0</text></svg>