<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="mainv-title mainv-desc"><title id="mainv-title">MA(1) 的可逆与不可逆表示</title><desc id="mainv-desc">MA(1) 系数 2 和 0.5 的一阶自相关相同，均为 0.4；但可逆性仅要求 MA 根在单位圆外，即 |θ|&lt;1。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.label{font-size:15px}.strong{font-size:16px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="34" y="40" class="heading">相同 ACF，不代表参数表示唯一</text><rect x="28" y="72" width="436" height="263" rx="13" fill="#faeae4" stroke="#dce7e4"/><rect x="493" y="72" width="437" height="263" rx="13" fill="#e7f3ee" stroke="#dce7e4"/><text x="51" y="113" class="strong">θ = 2：不可逆</text><text x="517" y="113" class="strong">θ = 0.5：可逆</text><text x="52" y="163" class="label">ρ₁ = 2 / 5 = 0.4</text><text x="517" y="163" class="label">ρ₁ = 0.5 / 1.25 = 0.4</text><text x="52" y="210" class="label">Θ(z)=1+2z → 根 −0.5</text><text x="517" y="210" class="label">Θ(z)=1+0.5z → 根 −2</text><text x="52" y="268" class="strong">根在单位圆内</text><text x="517" y="268" class="strong">根在单位圆外</text></svg>