<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="armavalid-title armavalid-desc"><title id="armavalid-title">ARMA 建模需要拟合诊断和时间回测</title><desc id="armavalid-desc">候选阶数、拟合估计、创新诊断和真实时间外预测构成迭代闭环；不把 AIC 极小视为最终证明。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.label{font-size:15px}.strong{font-size:16px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="35" y="41" class="heading">模型选择是一个有反馈的检验循环</text><rect x="29" y="73" width="436" height="113" rx="13" fill="#f4f8f5" stroke="#dce7e4"/><text x="46" y="115" class="strong">01 候选模型</text><text x="46" y="150" class="label">从 ACF / PACF 和理论约束开始</text><rect x="490" y="73" width="436" height="113" rx="13" fill="#f4f8f5" stroke="#dce7e4"/><text x="507" y="115" class="strong">02 拟合参数</text><text x="507" y="150" class="label">检查收敛、根、可比的信息准则</text><rect x="29" y="201" width="436" height="113" rx="13" fill="#f4f8f5" stroke="#dce7e4"/><text x="46" y="243" class="strong">03 创新诊断</text><text x="46" y="278" class="label">残差 ACF、Ljung–Box、异常波动</text><rect x="490" y="201" width="436" height="113" rx="13" fill="#e4f2ed" stroke="#dce7e4"/><text x="507" y="243" class="strong">04 时间回测</text><text x="507" y="278" class="label">未来区间验证、与朴素基线比较</text><path d="M467 130 L490 130" stroke="#147f80" stroke-width="4"  fill="none"/><path d="M700 186 L700 199" stroke="#147f80" stroke-width="4"  fill="none"/><path d="M490 256 L466 256" stroke="#147f80" stroke-width="4"  fill="none"/></svg>