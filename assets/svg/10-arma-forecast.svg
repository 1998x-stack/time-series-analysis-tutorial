<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="armafc-title armafc-desc"><title id="armafc-title">ARMA(1,1) 的多步预测逐渐回到均值</title><desc id="armafc-desc">未来未知创新的条件期望为零，历史的条件偏差经 AR 系数 φ 的幂次衰减，因而预测逐渐收敛到长期均值。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.label{font-size:15px}.strong{font-size:16px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">在平稳 ARMA(1,1) 中，远期预测趋向 μ</text><rect x="30" y="64" width="901" height="276" rx="13" fill="#f4f8f5" stroke="#dce7e4"/><path d="M103 298 L861 298" stroke="#b7c9c8" stroke-width="2"  fill="none"/><path d="M103 115 L103 298" stroke="#b7c9c8" stroke-width="2"  fill="none"/><path d="M104 283 L863 283" stroke="#d06d4d" stroke-width="2" stroke-dasharray="7 6" fill="none"/><polyline points="103.0,129.1 161.3,160.0 219.6,196.3 277.9,220.6 336.2,236.8 394.5,247.7 452.8,255.0 511.2,259.9 569.5,263.2 627.8,265.4 686.1,266.9 744.4,267.8 802.7,268.5 861.0,268.9" fill="none" stroke="#147f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="110" y="322" class="note">h=1</text><text x="790" y="322" class="note">h=14</text><text x="570" y="125" class="strong">青色：预测偏差</text><text x="570" y="152" class="note">虚线：长期均值</text></svg>