<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="ss-title ss-desc"><title id="ss-title">状态空间模型：隐藏状态链与观测方程</title><desc id="ss-desc">隐藏状态序列由上期状态经转移矩阵 T 加过程噪声生成；观测由当期状态经 Z 映射并叠加观测噪声得到。状态不可直接观测。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.box{font-size:15px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><defs><marker id="ss-a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7461ba"/></marker><marker id="ss-b" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#147f80"/></marker></defs><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">状态空间模型：看不见的状态在演化，看得见的观测被它们生成</text><rect x="24" y="60" width="912" height="280" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><text x="60" y="106" class="note">隐藏状态 α（不可观测）</text><g><rect x="120" y="118" width="120" height="56" rx="10" fill="#eef0fa" stroke="#7461ba"/><text x="180" y="152" class="box" text-anchor="middle">αₜ₋₁</text><rect x="420" y="118" width="120" height="56" rx="10" fill="#eef0fa" stroke="#7461ba"/><text x="480" y="152" class="box" text-anchor="middle">αₜ</text><rect x="720" y="118" width="120" height="56" rx="10" fill="#eef0fa" stroke="#7461ba"/><text x="780" y="152" class="box" text-anchor="middle">αₜ₊₁</text></g><path d="M240 146 L418 146" stroke="#7461ba" stroke-width="2.6" fill="none" marker-end="url(#ss-a)"/><path d="M540 146 L718 146" stroke="#7461ba" stroke-width="2.6" fill="none" marker-end="url(#ss-a)"/><text x="330" y="134" class="note" text-anchor="middle">T（+过程噪声 η）</text><text x="630" y="134" class="note" text-anchor="middle">T（+过程噪声 η）</text><g><rect x="120" y="240" width="120" height="56" rx="10" fill="#e8f4f0" stroke="#147f80"/><text x="180" y="274" class="box" text-anchor="middle">yₜ₋₁</text><rect x="420" y="240" width="120" height="56" rx="10" fill="#e8f4f0" stroke="#147f80"/><text x="480" y="274" class="box" text-anchor="middle">yₜ</text><rect x="720" y="240" width="120" height="56" rx="10" fill="#e8f4f0" stroke="#147f80"/><text x="780" y="274" class="box" text-anchor="middle">yₜ₊₁</text></g><text x="60" y="278" class="note">观测 y（可见）</text><path d="M180 174 L180 238" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#ss-b)"/><path d="M480 174 L480 238" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#ss-b)"/><path d="M780 174 L780 238" stroke="#147f80" stroke-width="2.6" fill="none" marker-end="url(#ss-b)"/><text x="200" y="212" class="note">Z（+观测噪声 ε）</text><text x="500" y="212" class="note">Z（+观测噪声 ε）</text><text x="800" y="212" class="note">Z（+观测噪声 ε）</text><text x="32" y="326" class="note">结构示意：状态方程 αₜ=T αₜ₋₁+R ηₜ；观测方程 yₜ=Z αₜ+εₜ。改变 T、Z 与噪声协方差，就能得到不同模型。</text></svg>
