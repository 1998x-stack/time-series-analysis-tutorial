<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="bt-title bt-desc"><title id="bt-title">滚动起点回测：每次只用过去的数据预测下一期</title><desc id="bt-desc">回测把训练窗口沿时间向前滚动：第 i 轮只用截止到当前时刻的数据拟合，预测下一期，再与真实值比较；多轮累积可得到每个步长的误差分布。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.strong{font-size:14px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">滚动起点回测：训练窗口向前滑动，每轮只预测未来</text><rect x="24" y="60" width="912" height="280" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><path d="M70 300 L890 300" stroke="#b7c9c8" stroke-width="2"/><text x="70" y="322" class="note">时间 →</text><text x="890" y="322" class="note" text-anchor="end">未来</text><g><rect x="70" y="96" width="300" height="30" rx="7" fill="#cfe7e1" stroke="#147f80"/><text x="220" y="116" class="strong" text-anchor="middle">第 1 轮：训练</text><circle cx="392" cy="111" r="8" fill="#d06d4d"/><text x="408" y="116" class="note">预测 t₁+1</text><rect x="150" y="166" width="300" height="30" rx="7" fill="#cfe7e1" stroke="#147f80"/><text x="300" y="186" class="strong" text-anchor="middle">第 2 轮：训练（窗口前移）</text><circle cx="472" cy="181" r="8" fill="#d06d4d"/><text x="488" y="186" class="note">预测 t₂+1</text><rect x="230" y="236" width="300" height="30" rx="7" fill="#cfe7e1" stroke="#147f80"/><text x="380" y="256" class="strong" text-anchor="middle">第 3 轮：训练（继续前移）</text><circle cx="552" cy="251" r="8" fill="#d06d4d"/><text x="568" y="256" class="note">预测 t₃+1</text></g><text x="70" y="86" class="note">每轮只用到“当前”为止的信息，绝不使用未来观测</text><text x="32" y="358" class="note">累积多轮的一步预测误差可得到 MAE/RMSE/MASE；若要评估多步预测，则每轮记录 h=1…H 的误差。</text></svg>
