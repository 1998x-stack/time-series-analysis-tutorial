<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="difference-title difference-desc"><title id="difference-title">差分不是抹去信息，而是重写变化</title><desc id="difference-desc">一阶差分 Δy_t = y_t − y_(t−1) 转换的是相邻时点之间的变化量；差分会减少可用起始观测。</desc><rect x="1" y="1" width="958" height="338" rx="20" fill="#fffdf9" stroke="#dce5e5"/><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#294049} .k{font-size:14px;font-weight:650}.s{font-size:12px;fill:#647880}.t{font-size:18px;font-weight:750}.grid{stroke:#e4ebec;stroke-width:1} .a{stroke:#147f80;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{stroke:#d06d4d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{stroke:#7461ba;stroke-width:2.5;fill:none;stroke-linecap:round} .panel{fill:#f7f9f7;stroke:#dfe9e8}</style><rect class="panel" x="35" y="46" width="890" height="259" rx="14"/><text class="t" x="60" y="79">原始序列 yₜ</text><text class="t" x="520" y="79">一阶差分 Δyₜ</text><line x1="59" y1="245" x2="389" y2="245" stroke="#8fa5a5" stroke-width="1.5"/><line class="grid" x1="59" y1="121" x2="389" y2="121"/><line class="grid" x1="59" y1="162.3" x2="389" y2="162.3"/><line class="grid" x1="59" y1="203.7" x2="389" y2="203.7"/><line class="grid" x1="59" y1="245" x2="389" y2="245"/><line x1="547" y1="245" x2="871" y2="245" stroke="#8fa5a5" stroke-width="1.5"/><line class="grid" x1="547" y1="121" x2="871" y2="121"/><line class="grid" x1="547" y1="162.3" x2="871" y2="162.3"/><line class="grid" x1="547" y1="203.7" x2="871" y2="203.7"/><line class="grid" x1="547" y1="245" x2="871" y2="245"/><path class="a"  d="M59 232.6 L89 225.2 L119 215.2 L149 205.3 L179 207.8 L209 200.4 L239 183 L269 178 L299 163.2 L329 165.6 L359 155.7 L389 138.4"/><path class="b"  d="M547 186.6 L579.4 179.4 L611.8 179.4 L644.2 215.8 L676.6 186.6 L709 157.5 L741.4 193.9 L773.8 164.8 L806.2 215.8 L838.6 179.4 L871 157.5"/><path d="M420 172 L501 172" stroke="#7461ba" stroke-width="