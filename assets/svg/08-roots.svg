<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="arroot-title arroot-desc"><title id="arroot-title">AR 特征根必须位于单位圆外</title><desc id="arroot-desc">对于因果平稳 AR(p)，Φ(z)=1−Σφⱼ zʲ 的所有根的模必须大于 1。单位圆上的根意味着稳定性边界。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.label{font-size:15px}.strong{font-size:16px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="34" y="41" class="heading">不是要求系数之和小于 1，而是所有特征根在单位圆外</text><rect x="30" y="65" width="900" height="275" rx="13" fill="#f4f8f5" stroke="#dce7e4"/><path d="M100 204 L554 204" stroke="#839d9d" stroke-width="2"  fill="none"/><path d="M327 91 L327 319" stroke="#839d9d" stroke-width="2"  fill="none"/><circle cx="327" cy="204" r="101" fill="none" stroke="#b6c7ce" stroke-width="3" stroke-dasharray="6 6"/><circle cx="487" cy="205" r="9" fill="#147f80"/><circle cx="269" cy="205" r="9" fill="#d06d4d"/><text x="588" y="119" class="strong">青点：圆外的根</text><text x="588" y="163" class="strong">橙点：圆内的根</text><text x="588" y="217" class="label">Φ(z) = 1 − φ₁z − … − φₚzᵖ</text><text x="588" y="262" class="note">单位圆 |z|=1 是边界。</text></svg>