<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="hero-title hero-desc"><title id="hero-title">时间序列的结构</title><desc id="hero-desc">横轴为时间，观测值由趋势和季节变化叠加而成。</desc><rect x="1" y="1" width="958" height="358" rx="20" fill="#fffdf9" stroke="#dce5e5"/><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#294049} .k{font-size:14px;font-weight:650}.s{font-size:12px;fill:#647880}.t{font-size:18px;font-weight:750}.grid{stroke:#e4ebec;stroke-width:1} .a{stroke:#147f80;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{stroke:#d06d4d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{stroke:#7461ba;stroke-width:2.5;fill:none;stroke-linecap:round} .panel{fill:#f7f9f7;stroke:#dfe9e8}</style><rect class="panel" x="42" y="53" width="876" height="260" rx="18"/><text class="t" x="70" y="91">从观测发现结构</text><text class="s" x="70" y="117">同一条曲线同时包含长期变化、重复波动与随机扰动。</text><line x1="78" y1="270" x2="868" y2="270" stroke="#8fa5a5" stroke-width="1.5"/><line class="grid" x1="78" y1="147" x2="868" y2="147"/><line class="grid" x1="78" y1="188" x2="868" y2="188"/><line class="grid" x1="78" y1="229" x2="868" y2="229"/><line class="grid" x1="78" y1="270" x2="868" y2="270"/><path class="a"  d="M78 234.8 L112.3 213.7 L146.7 208.4 L181 206.7 L215.4 209.3 L249.7 215.6 L284.1 224 L318.4 232.4 L352.8 225.2 L387.1 227.7 L421.5 226.1 L455.8 220.7 L490.2 213.2 L524.5 205.7 L558.9 200.3 L593.2 185 L627.6 187.6 L661.9 193.9 L696.3 202.4 L730.6 210.8 L765 217.1 L799.3 219.7 L833.7 204.4 L868 199"/><path class="b" stroke-dasharray="8 7" d="M78 248 L868 181"/><text class="s" x="81" y="299">0</text><text class="s" x="840" y="299">时间 →</text><text class="k" x="718" y="96">— 观测</text><text class="k" x="818" y="96">— 趋势</text></svg>