<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="d-title d-desc" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><title id="d-title" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">Prophet 加性分解的四个分量</title><desc id="d-desc" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">从上到下依次是带变化点的分段线性趋势、周期为 7 的季节曲线、围绕零的节假日脉冲，以及三者相加再加上噪声的观测序列。</desc><style style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.h{font-size:21px;font-weight:750}.n{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="318" rx="13" fill="#fffdf9" stroke="#dce7e4" style=";fill:rgb(255, 253, 249);stroke:rgb(220, 231, 228);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="30" y="40" class="h" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:21px;font-weight:750;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">观测 = 趋势 + 季节性 + 节假日 + 误差</text>
<line x1="150" y1="84" x2="900" y2="84" stroke="#cfdedb" style=";fill:rgb(0, 0, 0);stroke:rgb(207, 222, 219);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></line><path d="M150 84 L420 70 L430 42 L760 58 L900 50" fill="none" stroke="#147f80" stroke-width="2.8" style=";stroke:rgb(20, 127, 128);stroke-width:2.8px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><text x="30" y="80" class="n" style=";fill:rgb(88, 110, 114);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">趋势 g(t)</text><circle cx="425" cy="56" r="5" fill="#d06d4d" style=";fill:rgb(208, 109, 77);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></circle><text x="440" y="36" class="n" fill="#b2563a" style=";fill:rgb(88, 110, 114);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">变化点</text>
<line x1="150" y1="162" x2="900" y2="162" stroke="#cfdedb" style=";fill:rgb(0, 0, 0);stroke:rgb(207, 222, 219);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></line><path d="M150 162 Q166 130 182 162 Q198 194 214 162 Q230 130 246 162 Q262 194 278 162 Q294 130 310 162 Q326 194 342 162 Q358 130 374 162 Q390 194 406 162 Q422 130 438 162 Q454 194 470 162 Q486 130 502 162 Q518 194 534 162 Q550 130 566 162 Q582 194 598 162" fill="none" stroke="#7461ba" stroke-width="2.4" style=";stroke:rgb(116, 97, 186);stroke-width:2.4px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><text x="30" y="158" class="n" style=";fill:rgb(88, 110, 114);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">季节 s(t)</text>
<line x1="150" y1="240" x2="900" y2="240" stroke="#cfdedb" style=";fill:rgb(0, 0, 0);stroke:rgb(207, 222, 219);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></line><rect x="360" y="212" width="14" height="28" fill="#d06d4d" style=";fill:rgb(208, 109, 77);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><rect x="520" y="200" width="14" height="40" fill="#d06d4d" style=";fill:rgb(208, 109, 77);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><rect x="760" y="220" width="14" height="20" fill="#d06d4d" style=";fill:rgb(208, 109, 77);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="30" y="236" class="n" style=";fill:rgb(88, 110, 114);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">节假日 h(t)</text>
<text x="30" y="300" class="n" style=";fill:rgb(88, 110, 114);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">三行分别为 g、s、h；观测序列是它们逐点相加再叠上误差。乘法形式下季节/节假日改为乘在趋势上。</text></svg>
