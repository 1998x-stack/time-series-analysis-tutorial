<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="dynamic-title dynamic-desc"><title id="dynamic-title">时间回归的两条信息通道</title><desc id="dynamic-desc">回归使用解释变量预测系统性均值，ARMA 误差过程描述均值之外的时间相关结构，最后叠加得到预测。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.label{font-size:15px}.strong{font-size:16px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="36" y="44" class="heading">把解释性均值与动态误差分开处理</text><rect x="34" y="95" width="255" height="157" rx="13" fill="#e5f4ee" stroke="#dce7e4"/><rect x="351" y="95" width="255" height="157" rx="13" fill="#fbebe3" stroke="#dce7e4"/><rect x="668" y="95" width="257" height="157" rx="13" fill="#eeebf8" stroke="#dce7e4"/><text x="59" y="135" class="strong">回归分量</text><text x="59" y="185" class="label">mₜ = β₀ + β₁xₜ</text><text x="377" y="135" class="strong">相关误差分量</text><text x="377" y="185" class="label">uₜ = φuₜ₋₁ + εₜ</text><text x="690" y="135" class="strong">实际响应</text><text x="690" y="185" class="label">yₜ = mₜ + uₜ</text><path d="M291 175 L348 175" stroke="#147f80" stroke-width="4"  fill="none"/><path d="M610 175 L665 175" stroke="#d06d4d" stroke-width="4"  fill="none"/><text x="56" y="296" class="note">未来解释变量必须在预测时刻可用；否则需要另行预测、情景假设或区间处理。</text></svg>