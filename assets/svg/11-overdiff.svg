<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="od-title od-desc"><title id="od-title">过度差分会引入负的一阶自相关并放大方差</title><desc id="od-desc">对已经是白噪声的一阶差分再做一次差分，新序列的样本自相关在滞后 1 处约为 −0.5，且边际方差约为原来的两倍，是过度差分的典型症状。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.strong{font-size:15px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">过度差分：负的一阶自相关 + 方差放大</text><rect x="24" y="70" width="440" height="248" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><text x="40" y="96" class="strong">二阶差分 Δ²y_t 的样本自相关</text><text x="40" y="118" class="note">滞后 1 显著为负，提示 MA 单位根</text><path d="M54 282 L434 282" stroke="#b7c9c8" stroke-width="2" fill="none"/><path d="M54 232 L54 300" stroke="#b7c9c8" stroke-width="2" fill="none"/><rect x="54.0" y="112.0" width="30.0" height="170.0" rx="3" fill="#7461ba"/><text x="69.0" y="300" class="note" text-anchor="middle">0</text><rect x="92.0" y="282.0" width="30.0" height="94.9" rx="3" fill="#d06d4d"/><text x="107.0" y="300" class="note" text-anchor="middle">1</text><text x="107.0" y="392.9" class="note" text-anchor="middle">≈ -0.56</text><rect x="130.0" y="256.9" width="30.0" height="25.1" rx="3" fill="#7461ba"/><text x="145.0" y="300" class="note" text-anchor="middle">2</text><rect x="168.0" y="282.0" width="30.0" height="19.4" rx="3" fill="#7461ba"/><text x="183.0" y="300" class="note" text-anchor="middle">3</text><rect x="206.0" y="278.7" width="30.0" height="3.3" rx="3" fill="#7461ba"/><text x="221.0" y="300" class="note" text-anchor="middle">4</text><rect x="244.0" y="280.0" width="30.0" height="2.0" rx="3" fill="#7461ba"/><text x="259.0" y="300" class="note" text-anchor="middle">5</text><rect x="282.0" y="282.0" width="30.0" height="2.1" rx="3" fill="#7461ba"/><text x="297.0" y="300" class="note" text-anchor="middle">6</text><rect x="320.0" y="275.9" width="30.0" height="6.1" rx="3" fill="#7461ba"/><text x="335.0" y="300" class="note" text-anchor="middle">7</text><rect x="358.0" y="282.0" width="30.0" height="12.1" rx="3" fill="#7461ba"/><text x="373.0" y="300" class="note" text-anchor="middle">8</text><rect x="396.0" y="269.9" width="30.0" height="12.1" rx="3" fill="#7461ba"/><text x="411.0" y="300" class="note" text-anchor="middle">9</text><rect x="536" y="70" width="380" height="248" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><text x="552" y="96" class="strong">边际方差（相对 Δ²y 归一）</text><text x="552" y="118" class="note">每多差分一次，方差进一步膨胀</text><path d="M576 290 L876 290" stroke="#b7c9c8" stroke-width="2" fill="none"/><rect x="626" y="216.7" width="66" height="73.3" rx="4" fill="#147f80"/><text x="659" y="206.7" class="note" text-anchor="middle">σ²≈0.49</text><text x="659" y="308" class="note" text-anchor="middle">Δy</text><rect x="746" y="140.0" width="66" height="150.0" rx="4" fill="#d06d4d"/><text x="779" y="130.0" class="note" text-anchor="middle">σ²≈1.00</text><text x="779" y="308" class="note" text-anchor="middle">Δ²y</text><text x="32" y="352" class="note">教学示意：同一合成随机游走（n=400）的 Δy 与 Δ²y，样本统计量会随样本波动。</text></svg>