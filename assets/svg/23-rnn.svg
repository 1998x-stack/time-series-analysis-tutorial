;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">紫色 = 隐藏状态及其共享转移权重 W_hh；青色 = 输入/输出。同一颜色即同一参数。</text></svg>
