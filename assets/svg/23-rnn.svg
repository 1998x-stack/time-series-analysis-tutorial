rule:nonzero;visibility:visible">h₃</text></g><path d="M240 148 L408 148" stroke="#7461ba" stroke-width="2.6" fill="none" marker-end="url(#r-a)" style=";stroke:rgb(116, 97, 186);stroke-width:2.6px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><path d="M530 148 L698 148" stroke="#7461ba" stroke-width="2.6" fill="none" marker-end="url(#r-a)" style=";stroke:rgb(116, 97, 186);stroke-width:2.6px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><text x="324" y="138" class="n" text-anchor="middle" style=";fill:rgb(88, 110, 114);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">W_hh（同一矩阵）</text><text x="614" y="138" class="n" text-anchor="middle" style=";fill:rgb(88, 110, 114);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">W_hh（同一矩阵）</text><path d="M180 118 L180 82" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#r-b)" style=";stroke:rgb(20, 127, 128);stroke-width:2.4px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><path d="M470 118 L470 82" stroke="#147f80" stroke-width="2.4" fill="none" marker-end="url(#r-b)" style=";stroke:rgb(20, 127, 128);