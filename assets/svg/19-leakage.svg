<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="lk-title lk-desc"><title id="lk-title">滚动特征与目标的对齐：正确与泄露</title><desc id="lk-desc">预测目标 y_t 时，正确做法让滚动窗口只覆盖 y_t 之前的值并向后平移对齐；泄露做法让窗口包含 y_t 本身，使特征携带了要预测的值。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.h{font-size:21px;font-weight:750}.lab{font-size:15px;font-weight:700}.n{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="30" y="40" class="h">同一个滚动均值，只差一步对齐就是泄露</text>
<text x="30" y="86" class="n">时间轴（向右为未来）；目标为 yₜ（橙色）</text>
<g><rect x="120" y="104" width="96" height="50" rx="8" fill="#f1f5f4" stroke="#dce7e4"/><text x="168" y="135" class="lab" text-anchor="middle">yₜ₋₃</text><rect x="228" y="104" width="96" height="50" rx="8" fill="#f1f5f4" stroke="#dce7e4"/><text x="276" y="135" class="lab" text-anchor="middle">yₜ₋₂</text><rect x="336" y="104" width="96" height="50" rx="8" fill="#f1f5f4" stroke="#dce7e4"/><text x="384" y="135" class="lab" text-anchor="middle">yₜ₋₁</text><rect x="444" y="104" width="96" height="50" rx="8" fill="#fbf1ec" stroke="#d06d4d" stroke-width="2.5"/><text x="492" y="135" class="lab" text-anchor="middle" fill="#b2563a">yₜ</text><rect x="552" y="104" width="96" height="50" rx="8" fill="#ffffff" stroke="#e7eeec" stroke-dasharray="5 4"/><text x="600" y="135" class="lab" text-anchor="middle" fill="#9fb0ad">yₜ₊₁</text><rect x="660" y="104" width="96" height="50" rx="8" fill="#ffffff" stroke="#e7eeec" stroke-dasharray="5 4"/><text x="708" y="135" class="lab" text-anchor="middle" fill="#9fb0ad">yₜ₊₂</text></g>
<rect x="120" y="196" width="312" height="34" rx="7" fill="#e8f4f0" stroke="#147f80" stroke-width="2"/><text x="276" y="219" class="n" text-anchor="middle" fill="#0f6a6b">正确：窗口 = (yₜ₋₃, yₜ₋₂, yₜ₋₁)，不含 yₜ</text>
<path d="M276 230 L276 258" stroke="#147f80" stroke-width="2.2" fill="none"/><text x="276" y="280" class="n" text-anchor="middle" fill="#0f6a6b">先把特征算好，再 shift(h) 对齐目标 ✓</text>
<rect x="228" y="304" width="312" height="34" rx="7" fill="#fbf1ec" stroke="#d06d4d" stroke-width="2"/><text x="384" y="327" class="n" text-anchor="middle" fill="#b2563a">泄露：窗口 = (yₜ₋₂, yₜ₋₁, yₜ)，含 yₜ</text>
<path d="M492 154 L492 196" stroke="#d06d4d" stroke-width="2.2" fill="none"/><text x="700" y="325" class="n" fill="#b2563a">特征里已经“看到” yₜ → 离线分数虚高</text></svg>
