<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="ir-title ir-desc"><title id="ir-title">VAR(1) 的脉冲响应随滞后期衰减</title><desc id="ir-desc">对变量 y1 施加单位冲击后，y1 自身与其交叉项 y2 的响应都随滞后期衰减；只要系数矩阵的特征值模小于 1，系统就是平稳的。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.strong{font-size:15px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">脉冲响应：冲击在系统内传导并逐步衰减</text><rect x="24" y="60" width="912" height="290" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><path d="M110 300 L860 300" stroke="#b7c9c8" stroke-width="2" fill="none"/><path d="M110 300 L110 88" stroke="#b7c9c8" stroke-width="2" fill="none"/><text x="485" y="334" class="note" text-anchor="middle">冲击后第 h 期</text><polyline points="110.0,109.5 178.2,204.8 246.4,241.0 314.5,257.9 382.7,267.9 450.9,274.8 519.1,279.9 587.3,284.0 655.5,287.2 723.6,289.8 791.8,291.8 860.0,293.5" fill="none" stroke="#147f80" stroke-width="3"/><polyline points="110.0,300.0 178.2,242.9 246.4,237.1 314.5,244.6 382.7,254.1 450.9,262.8 519.1,270.1 587.3,276.1 655.5,280.8 723.6,284.7 791.8,287.7 860.0,290.2" fill="none" stroke="#7461ba" stroke-width="3" stroke-dasharray="8 6"/><g><rect x="150" y="330" width="16" height="16" rx="3" fill="#147f80"/><text x="172" y="344" class="note">y₁ 对 y₁ 冲击的响应</text><rect x="470" y="330" width="16" height="16" rx="3" fill="#7461ba"/><text x="492" y="344" class="note">y₁ 对 y₂ 冲击的响应（注意：非零即存在交叉传导）</text></g><text x="32" y="368" class="note">教学示意：A=[[0.5,0.3],[0.2,0.6]] 的解析脉冲响应，非估计结果。</text></svg>