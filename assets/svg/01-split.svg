<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="split-title split-desc"><title id="split-title">时间感知的回测</title><desc id="split-desc">训练、验证与测试沿时间轴向前推进；不能用后面的数据计算前面的训练特征。</desc><rect x="1" y="1" width="958" height="338" rx="20" fill="#fffdf9" stroke="#dce5e5"/><style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#294049} .k{font-size:14px;font-weight:650}.s{font-size:12px;fill:#647880}.t{font-size:18px;font-weight:750}.grid{stroke:#e4ebec;stroke-width:1} .a{stroke:#147f80;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{stroke:#d06d4d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{stroke:#7461ba;stroke-width:2.5;fill:none;stroke-linecap:round} .panel{fill:#f7f9f7;stroke:#dfe9e8}</style><rect class="panel" x="33" y="47" width="894" height="250" rx="15"/><text class="t" x="58" y="82">可用信息沿时间向前增加</text><line x1="62" y1="192" x2="896" y2="192" stroke="#677c80" stroke-width="2"/><path d="M884 186 L896 192 L884 198" fill="none" stroke="#677c80" stroke-width="2"/><rect x="68" y="129" width="416" height="57" rx="8" fill="#d2e9e6"/><rect x="492" y="129" width="184" height="57" rx="8" fill="#f5dfd7"/><rect x="684" y="129" width="197" height="57" rx="8" fill="#e6e0f4"/><text class="k" x="212" y="164">训练：拟合参数</text><text class="k" x="538" y="164">验证：选模型</text><text class="k" x="728" y="164">测试：最终评估</text><text class="s" x="68" y="236">过去</text><text class="s" x="837" y="236">未来</text><text class="s" x="68" y="268">禁止：先全局标准化，再拆分训练/测试。</text></svg>