<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="w-title w-desc"><title id="w-title">滑窗把时间序列变成监督学习表格</title><desc id="w-desc">一条序列被长度为 2 的窗口覆盖，窗口内的值成为滞后特征，窗口右侧第 1 期的值成为目标；不同窗口依次生成多行样本，组成特征-目标表格。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.h{font-size:21px;font-weight:750}.lab{font-size:15px;font-weight:700}.n{font-size:13px;fill:#586e72}</style><defs><marker id="w-a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#d06d4d"/></marker></defs><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="30" y="40" class="h">滑窗：用过去 L 期特征预测未来第 h 期目标</text><text x="30" y="74" class="n">原始序列（时间向右）</text>
<g><rect x="60" y="90" width="70" height="46" rx="8" fill="#f1f5f4" stroke="#dce7e4"/><text x="95" y="119" class="lab" text-anchor="middle">y₁</text><rect x="144" y="90" width="70" height="46" rx="8" fill="#f1f5f4" stroke="#dce7e4"/><text x="179" y="119" class="lab" text-anchor="middle">y₂</text><rect x="228" y="90" width="70" height="46" rx="8" fill="#e8f4f0" stroke="#147f80" stroke-width="2"/><text x="263" y="119" class="lab" text-anchor="middle">y₃</text><rect x="312" y="90" width="70" height="46" rx="8" fill="#e8f4f0" stroke="#147f80" stroke-width="2"/><text x="347" y="119" class="lab" text-anchor="middle">y₄</text><rect x="396" y="90" width="70" height="46" rx="8" fill="#fbf1ec" stroke="#d06d4d" stroke-width="2"/><text x="431" y="119" class="lab" text-anchor="middle">y₅</text><rect x="480" y="90" width="70" height="46" rx="8" fill="#f1f5f4" stroke="#dce7e4"/><text x="515" y="119" class="lab" text-anchor="middle">y₆</text><rect x="564" y="90" width="70" height="46" rx="8" fill="#f1f5f4" stroke="#dce7e4"/><text x="599" y="119" class="lab" text-anchor="middle">y₇</text><rect x="648" y="90" width="70" height="46" rx="8" fill="#f1f5f4" stroke="#dce7e4"/><text x="683" y="119" class="lab" text-anchor="middle">y₈</text></g>
<rect x="220" y="82" width="170" height="62" rx="10" fill="none" stroke="#147f80" stroke-width="3" stroke-dasharray="7 5"/><text x="305" y="166" class="n" text-anchor="middle">窗口 L=2：特征 = (y₃, y₄)</text><text x="431" y="166" class="n" text-anchor="middle" fill="#b2563a">目标 = y₅</text><path d="M305 172 L305 200 L420 200 L420 186" stroke="#d06d4d" stroke-width="2.4" fill="none" marker-end="url(#w-a)"/>
<g transform="translate(300,206)"><rect x="0" y="0" width="600" height="150" rx="11" fill="#f4f8f5" stroke="#dce7e4"/><rect x="0" y="0" width="600" height="38" rx="11" fill="#e8f4f0"/><text x="14" y="25" class="n" font-weight="700">样本</text><text x="150" y="25" class="n" font-weight="700">lag_2</text><text x="290" y="25" class="n" font-weight="700">lag_1</text><text x="440" y="25" class="n" font-weight="700">目标 y(t)</text><line x1="0" y1="38" x2="600" y2="38" stroke="#dce7e4"/><line x1="0" y1="75" x2="600" y2="75" stroke="#dce7e4"/><line x1="0" y1="112" x2="600" y2="112" stroke="#dce7e4"/><text x="14" y="62" class="n">t=3</text><text x="150" y="62" class="n">y₁</text><text x="290" y="62" class="n">y₂</text><text x="440" y="62" class="n" fill="#b2563a">y₃</text><text x="14" y="99" class="n">t=4</text><text x="150" y="99" class="n">y₂</text><text x="290" y="99" class="n">y₃</text><text x="440" y="99" class="n" fill="#b2563a">y₄</text><text x="14" y="136" class="n">t=5</text><text x="150" y="136" class="n">y₃</text><text x="290" y="136" class="n">y₄</text><text x="440" y="136" class="n" fill="#b2563a">y₅</text></g>
<text x="30" y="372" class="n">青色 = 特征（历史），橙色 = 目标（未来）。行与行共享历史，故样本不独立，必须按时间划分。</text></svg>
