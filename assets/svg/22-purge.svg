<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="p-title p-desc" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><title id="p-title" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">Purging 与 Embargo 在时间轴上的位置</title><desc id="p-desc" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">从左到右依次是训练段、隔离带（embargo）、测试段；被 purging 剔除的训练样本紧贴着测试段，用斜纹标出。</desc><style style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.h{font-size:21px;font-weight:750}.n{font-size:13px;fill:#586e72}.k{font-size:12px;fill:#41706e}</style><rect x="1" y="1" width="958" height="258" rx="13" fill="#fffdf9" stroke="#dce7e4" style=";fill:rgb(255, 253, 249);stroke:rgb(220, 231, 228);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="30" y="42" class="h" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:21px;font-weight:750;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">训练 | embargo | 测试：给近邻泄露留出缓冲区</text>
<rect x="40" y="90" width="560" height="54" fill="#e8f4f0" stroke="#147f80" style=";fill:rgb(232, 244, 240);stroke:rgb(20, 127, 128);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><rect x="600" y="90" width="90" height="54" fill="#f4edc9" stroke="#c9a227" stroke-dasharray="6 4" style=";fill:rgb(244, 237, 201);stroke:rgb(201, 162, 39);stroke-width:1px;stroke-dasharray:6px, 4px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><rect x="690" y="90" width="210" height="54" fill="#d06d4d" style=";fill:rgb(208, 109, 77);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect>
<rect x="520" y="90" width="80" height="54" fill="#fbe9e2" stroke="#d06d4d" stroke-dasharray="5 4" style=";fill:rgb(251, 233, 226);stroke:rgb(208, 109, 77);stroke-width:1px;stroke-dasharray:5px, 4px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="45" y="122" class="k" style=";fill:rgb(65, 112, 110);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">训练段（可用）</text><text x="606" y="122" class="k" style=";fill:rgb(65, 112, 110);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">embargo</text><text x="700" y="122" class="k" style=";fill:rgb(65, 112, 110);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">测试段</text><text x="522" y="80" class="k" fill="#b2563a" style=";fill:rgb(65, 112, 110);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">purge</text>
<text x="40" y="184" class="n" style=";fill:rgb(88, 110, 114);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">斜纹的 purge 区是被剔除的训练样本（与测试期重叠）；黄色 embargo 区是训练与测试之间的隔离带。</text>
<text x="40" y="212" class="n" style=";fill:rgb(88, 110, 114);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">隔离带宽度至少取最大滞后阶数，否则测试段首个样本仍会“看到”训练段末尾。</text></svg>
