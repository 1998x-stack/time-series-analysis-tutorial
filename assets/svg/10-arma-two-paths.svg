<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="armatwo-title armatwo-desc"><title id="armatwo-title">ARMA(1,1) 同时利用历史值与历史创新</title><desc id="armatwo-desc">自回归路径提供过去观测的反馈，移动平均路径提供历史创新的校正，预测时不能使用尚未发生的新创新。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.label{font-size:15px}.strong{font-size:16px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="33" y="40" class="heading">AR 反馈与 MA 冲击修正在当前预测相加</text><rect x="35" y="94" width="258" height="109" rx="13" fill="#e4f3ee" stroke="#dce7e4"/><rect x="35" y="237" width="258" height="109" rx="13" fill="#f9e9e1" stroke="#dce7e4"/><rect x="378" y="151" width="250" height="116" rx="13" fill="#f6f6eb" stroke="#dce7e4"/><rect x="718" y="151" width="203" height="116" rx="13" fill="#ebe9f8" stroke="#dce7e4"/><text x="57" y="138" class="strong">AR：历史观测</text><text x="57" y="170" class="label">φ(yₜ₋₁ − μ)</text><text x="57" y="277" class="strong">MA：历史创新</text><text x="57" y="310" class="label">θ εₜ₋₁</text><text x="402" y="191" class="strong">条件均值</text><text x="402" y="231" class="label">μ + AR项 + MA项</text><text x="741" y="191" class="strong">真实观测</text><text x="741" y="231" class="label">另加 εₜ</text><path d="M295 163 L374 188" stroke="#147f80" stroke-width="4"  fill="none"/><path d="M295 287 L374 238" stroke="#d06d4d" stroke-width="4"  fill="none"/><path d="M630 211 L715 211" stroke="#7461ba" stroke-width="4"  fill="none"/></svg>