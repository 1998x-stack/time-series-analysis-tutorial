<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="af-title af-desc"><title id="af-title">ARIMA 多步预测沿漂移延伸且不确定带变宽</title><desc id="af-desc">对含漂移的差分序列建模后，水平预测由确定性漂移与衰减的平稳修正构成；预测区间随步长按根号增长而变宽。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.strong{font-size:15px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">ARIMA 的水平预测沿漂移线延伸，不确定带随步长变宽</text><rect x="24" y="60" width="912" height="256" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><path d="M96 292 L868 292" stroke="#b7c9c8" stroke-width="2" fill="none"/><path d="M96 78 L96 292" stroke="#b7c9c8" stroke-width="2" fill="none"/><polygon points="497.4,174.3 528.3,145.9 559.2,122.6 590.1,102.3 621.0,83.8 651.8,66.4 682.7,49.8 713.6,33.7 744.5,18.0 775.4,2.5 806.2,-12.8 837.1,-27.9 868.0,-42.8 868.0,95.0 837.1,104.5 806.2,114.0 775.4,123.3 744.5,132.6 713.6,141.8 682.7,150.9 651.8,160.0 621.0,169.3 590.1,178.8 559.2,188.8 528.3,199.9 497.4,212.5" fill="#147f80" opacity="0.16"/><polyline points="497.4,172.8 528.3,160.5 559.2,148.3 590.1,136.1 621.0,123.9 651.8,111.6 682.7,99.4 713.6,87.2 744.5,74.9 775.4,62.7 806.2,50.5 837.1,38.3 868.0,26.0" fill="none" stroke="#d06d4d" stroke-width="2" stroke-dasharray="7 6"/><polyline points="96.0,261.4 126.9,250.0 157.8,259.5 188.6,242.3 219.5,232.8 250.4,238.5 281.3,223.2 312.2,211.8 343.0,217.5 373.9,204.1 404.8,192.6 435.7,198.4 466.6,185.0" fill="none" stroke="#203035" stroke-width="2.5" stroke-linejoin="round"/><polyline points="466.6,185.0 497.4,193.4 528.3,172.9 559.2,155.7 590.1,140.5 621.0,126.5 651.8,113.2 682.7,100.4 713.6,87.7 744.5,75.3 775.4,62.9 806.2,50.6 837.1,38.3 868.0,26.1" fill="none" stroke="#147f80" stroke-width="3" stroke-linejoin="round"/><path d="M466.6 78 L466.6 292" stroke="#b7c9c8" stroke-width="1.5" stroke-dasharray="4 5"/><text x="452.6" y="100" class="note" text-anchor="end">预测起点 T</text><text x="108" y="100" class="strong">历史观测</text><text x="860" y="100" class="note" text-anchor="end">青色：点预测　橙色虚线：漂移线　浅带：预测区间</text><text x="32" y="352" class="note">教学示意：按“漂移 + 衰减修正 + 根号扩张区间”的解析形式绘制，非软件拟合输出。</text></svg>