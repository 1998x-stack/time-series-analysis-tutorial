<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="ra-title ra-desc"><title id="ra-title">残差自相关：正确设定与遗漏季节项</title><desc id="ra-desc">设定正确的模型残差自相关在各滞后接近零；遗漏季节项的模型残差自相关在滞后 12 明显为正，提示仍有季节信息未被提取。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.strong{font-size:15px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">残差 ACF：滞后 12 的尖峰是“缺了季节项”的线索</text><rect x="24" y="70" width="440" height="248" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><text x="40" y="96" class="strong">设定正确模型的残差自相关</text><text x="40" y="118" class="note">各滞后接近零，无系统模式</text><path d="M54 282 L434 282" stroke="#b7c9c8" stroke-width="2" fill="none"/><rect x="54.0" y="132.0" width="12.2" height="150.0" fill="#147f80"/><rect x="69.2" y="282.0" width="12.2" height="2.0" fill="#147f80"/><rect x="84.4" y="282.0" width="12.2" height="2.0" fill="#147f80"/><rect x="99.6" y="282.0" width="12.2" height="14.2" fill="#147f80"/><rect x="114.8" y="274.6" width="12.2" height="7.4" fill="#147f80"/><rect x="130.0" y="280.0" width="12.2" height="2.0" fill="#147f80"/><rect x="145.2" y="282.0" width="12.2" height="9.8" fill="#147f80"/><rect x="160.4" y="277.1" width="12.2" height="4.9" fill="#147f80"/><rect x="175.6" y="282.0" width="12.2" height="2.0" fill="#147f80"/><rect x="190.8" y="277.4" width="12.2" height="4.6" fill="#147f80"/><rect x="206.0" y="282.0" width="12.2" height="7.8" fill="#147f80"/><rect x="221.2" y="276.6" width="12.2" height="5.4" fill="#147f80"/><rect x="236.4" y="282.0" width="12.2" height="5.4" fill="#d06d4d"/><rect x="251.6" y="282.0" width="12.2" height="2.0" fill="#147f80"/><rect x="266.8" y="276.4" width="12.2" height="5.6" fill="#147f80"/><rect x="282.0" y="282.0" width="12.2" height="3.9" fill="#147f80"/><rect x="297.2" y="282.0" width="12.2" heig