<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="kg-title kg-desc"><title id="kg-title">卡尔曼增益随观测噪声增大而下降</title><desc id="kg-desc">固定先验不确定度时，观测噪声越大，卡尔曼增益越小，滤波估计越依赖模型预测；噪声越小，增益越大，越依赖新观测。</desc><style>text{fill:#203035;font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:750}.strong{font-size:15px;font-weight:720}.note{font-size:13px;fill:#586e72}</style><rect x="1" y="1" width="958" height="378" rx="13" fill="#fffdf9" stroke="#dce7e4"/><text x="32" y="40" class="heading">卡尔曼增益：在“信任模型”与“信任观测”之间动态权衡</text><rect x="24" y="60" width="912" height="290" rx="12" fill="#f4f8f5" stroke="#dce7e4"/><path d="M110 300 L860 300" stroke="#b7c9c8" stroke-width="2" fill="none"/><path d="M110 300 L110 90" stroke="#b7c9c8" stroke-width="2" fill="none"/><text x="485" y="334" class="note" text-anchor="middle">观测噪声方差 R（固定先验 P=1）</text><text x="102" y="100" class="note" text-anchor="end">增益 K</text><polyline points="110.0,109.5 115.0,115.4 120.1,120.9 125.1,126.0 130.1,130.9 135.2,135.5 140.2,139.9 145.2,144.1 150.3,148.0 155.3,151.7 160.3,155.3 165.4,158.7 170.4,161.9 175.4,165.0 180.5,168.0 185.5,170.8 190.5,173.5 195.6,176.1 200.6,178.6 205.6,181.0 210.7,183.3 215.7,185.6 220.7,187.7 225.8,189.8 230.8,191.7 235.8,193.6 240.9,195.5 245.9,197.3 250.9,199.0 256.0,200.7 261.0,202.3 266.0,203.8 271.1,205.4 276.1,206.8 281.1,208.2 286.2,209.6 291.2,211.0 296.2,212.2 301.3,213.5 306.3,214.7 311.3,215.9 316.4,217.1 321.4,218.2 326.4,219.3 331.5,220.4 336.5,221.4 341.5,222.4 346.6,223.4 351.6,224.4 356.6,225.3 361.7,226.2 366.7,227.1 371.7,228.0 376.8,228.8 381.8,229.7 386.8,230.5 391.9,231.3 396.9,232.1 401.9,232.8 407.0,233.6 412.0,234.3 417.0,235.0 422.1,235.7 427.1,236.4 432.1,237.0 437.2,237.7 442.2,238.3 447.2,238.9 452.3,239.6 457.3,240.2 462.3,240.7 467.4,241.3 472.4,241.9 477.4,242.4 482.5,243.0 487.5,243.5 492.6,244.1 497.6,244.6 502.6,245.1 507.7,245.6 512.7,246.1 517.7,246.5 522.8,247.0 527.8,247